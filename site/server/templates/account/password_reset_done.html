{% extends "account/base.html" %}

{% block head_title %}重置邮件已发送{% endblock %}

{% block content %}
  <h1>密码重置邮件已发出</h1>
  <p class="auth-subtitle">
    如果该邮箱已注册账号，我们已向其发送密码重置链接。请查收邮件（含垃圾邮件文件夹）并按提示设置新密码。
  </p>

  <div class="auth-links">
    <a href="{% url 'account_login' %}">返回登录</a>
  </div>
{% endblock %}
