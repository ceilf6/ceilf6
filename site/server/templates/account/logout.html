{% extends "account/base.html" %}

{% block head_title %}退出登录{% endblock %}

{% block content %}
  <h1>退出登录</h1>
  <p class="auth-subtitle">确认退出当前账号吗？退出后当前浏览器会话将立即失效。</p>

  <form class="auth-form" method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {{ redirect_field }}
    <button class="btn-primary" type="submit">确认退出</button>
    <a class="btn-secondary" href="/">取消并返回首页</a>
  </form>
{% endblock %}
