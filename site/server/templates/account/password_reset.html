{% extends "account/base.html" %}

{% block head_title %}找回密码{% endblock %}

{% block content %}
  <h1>找回密码</h1>
  <p class="auth-subtitle">输入您的注册邮箱，我们将向该邮箱发送密码重置链接。</p>

  <form class="auth-form" method="post" action="{% url 'account_reset_password' %}" novalidate>
    {% csrf_token %}
    {% include "account/snippets/form_fields.html" with form=form %}
    {{ redirect_field }}
    <button class="btn-primary" type="submit">发送密码重置邮件</button>
  </form>

  <div class="auth-links">
    <a href="{% url 'account_login' %}">想起密码了？返回登录</a>
  </div>
{% endblock %}
