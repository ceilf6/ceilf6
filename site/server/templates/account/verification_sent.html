{% extends "account/base.html" %}

{% block head_title %}验证邮件已发送{% endblock %}

{% block content %}
  <h1>请查收验证邮件</h1>
  <p class="auth-subtitle">
    我们已向您的邮箱发送了一封验证邮件。请打开邮件中的激活链接完成邮箱确认；完成验证后即可正常登录。
  </p>

  <div class="auth-links">
    <a href="{% url 'account_login' %}">已完成验证？前往登录</a>
  </div>
{% endblock %}
