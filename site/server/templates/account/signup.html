{% extends "account/base.html" %}

{% block head_title %}注册账号{% endblock %}

{% block content %}
  <h1>注册账号</h1>
  <p class="auth-subtitle">公开昵称用于页面互动展示；登录邮箱仅用于身份验证与找回密码，不会对外公开。</p>

  <form class="auth-form" method="post" action="{% url 'account_signup' %}" novalidate>
    {% csrf_token %}
    {% include "account/snippets/form_fields.html" with form=form %}
    {{ redirect_field }}
    <button class="btn-primary" type="submit">注册并发送验证邮件</button>
  </form>

  <div class="auth-links">
    <span>已有账号？<a href="{{ login_url }}">立即登录</a></span>
  </div>
{% endblock %}
