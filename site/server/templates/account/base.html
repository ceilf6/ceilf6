<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block head_title %}账户中心{% endblock %} · wangjinghong.com</title>
  <style>
    :root {
      --bg-void: #0b1226;
      --bg-deep: #14224a;
      --bg-midnight: #1d3057;
      --text-main: #f5f8ff;
      --text-muted: #c2d2ea;
      --accent-gold: #ffc069;
      --accent-dawn: #ff9a62;
      --panel-bg: rgba(13, 22, 44, 0.76);
      --panel-border: rgba(255, 214, 166, 0.22);
      --input-bg: rgba(8, 14, 30, 0.72);
      --input-border: rgba(194, 210, 234, 0.28);
      --danger-bg: rgba(239, 68, 68, 0.14);
      --danger-border: rgba(248, 113, 113, 0.45);
      --danger-text: #fecaca;
      --info-bg: rgba(255, 192, 105, 0.12);
      --info-border: rgba(255, 192, 105, 0.36);
      --card-shadow: 0 1px 2px rgba(1, 8, 20, 0.4), 0 18px 38px rgba(1, 8, 20, 0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(120% 130% at 8% 6%, rgba(255, 192, 105, 0.24) 0%, transparent 44%),
        radial-gradient(120% 150% at 95% 8%, rgba(191, 145, 243, 0.16) 0%, transparent 48%),
        radial-gradient(90% 120% at 50% 104%, rgba(255, 154, 98, 0.28) 0%, transparent 58%),
        linear-gradient(138deg, var(--bg-void) 0%, var(--bg-deep) 44%, var(--bg-midnight) 100%);
      background-attachment: fixed;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      font-family: "Azeret Mono", ui-monospace, "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.1rem;
    }

    .auth-shell {
      width: 100%;
      max-width: 460px;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }

    .auth-brand a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .auth-brand a:hover,
    .auth-brand a:focus-visible {
      color: var(--accent-gold);
    }

    .auth-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 2rem 1.85rem;
    }

    .auth-card h1 {
      font-size: 1.42rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.45rem;
      color: var(--text-main);
    }

    .auth-subtitle,
    .auth-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.15rem;
    }

    .auth-messages,
    .auth-error-box {
      list-style: none;
      margin-bottom: 1.15rem;
      padding: 0.75rem 0.95rem;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    .auth-messages {
      background: var(--info-bg);
      border: 1px solid var(--info-border);
      color: var(--text-main);
    }

    .auth-error-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

    .auth-messages li + li,
    .auth-error-box li + li {
      margin-top: 0.35rem;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
    }

    .form-field--checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.55rem;
    }

    .form-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .auth-card input[type="text"],
    .auth-card input[type="email"],
    .auth-card input[type="password"] {
      width: 100%;
      padding: 0.68rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .auth-card input[type="text"]:focus,
    .auth-card input[type="email"]:focus,
    .auth-card input[type="password"]:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(255, 192, 105, 0.18);
    }

    .auth-card input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--accent-gold);
    }

    .field-help {
      font-size: 0.78rem;
      color: var(--text-muted);
      opacity: 0.88;
    }

    .field-help ul {
      padding-left: 1.15rem;
      margin-top: 0.25rem;
    }

    .field-errors,
    .errorlist {
      list-style: none;
      font-size: 0.82rem;
      color: var(--danger-text);
    }

    .btn-primary,
    .auth-card button[type="submit"]:not(.btn-secondary) {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.74rem 1.1rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-dawn) 100%);
      color: #0b1226;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.18s ease;
      margin-top: 0.3rem;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible,
    .auth-card button[type="submit"]:not(.btn-secondary):hover,
    .auth-card button[type="submit"]:not(.btn-secondary):focus-visible {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.68rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease;
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .auth-links {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(194, 210, 234, 0.14);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .auth-card a:not(.btn-primary):not(.btn-secondary) {
      color: var(--accent-gold);
      text-decoration: none;
    }

    .auth-card a:not(.btn-primary):not(.btn-secondary):hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 1.2rem 0.85rem;
      }

      .auth-card {
        padding: 1.5rem 1.25rem;
        border-radius: 14px;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <a href="/">← 返回首页</a>
      <span>wangjinghong.com</span>
    </div>
    <main class="auth-card">
      {% if messages %}
        <ul class="auth-messages" role="status">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block extra_body %}{% endblock %}
</body>
</html>
