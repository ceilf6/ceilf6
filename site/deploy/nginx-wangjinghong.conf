# /etc/nginx/snippets/wangjinghong-api.conf
# Include this snippet inside the origin HTTPS `server { ... }` block for
# www.wangjinghong.com. Static SPA routes (`/` and `/static/*`) remain served
# directly from `/var/www/wangjinghong` without touching the Django backend.
#
# Note on Nginx `add_header`: defining `add_header` inside a `location` block
# overrides `add_header` directives inherited from the parent `server` block.
# Each location below explicitly emits `X-Content-Type-Options: nosniff`; if
# your parent `server` block defines HSTS or CSP, include them via a shared
# header snippet or verify response headers after `nginx -s reload`.

# Django Admin static assets (`STATIC_URL = "/django-static/"`), isolated from
# Vite's `/static/` bundle prefix. Uses a single `Cache-Control` header (1 hour,
# avoiding duplicate headers from `expires` and avoiding stale unhashed admin
# assets across Django upgrades).
location ^~ /django-static/ {
    alias /opt/wangjinghong/current/server/staticfiles/;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# JSON API endpoints (`/api/health/`, `/api/me/`, `/api/notes/*/comments/`, etc.)
location ^~ /api/ {
    if (-f /opt/wangjinghong/shared/.maintenance) {
        return 503;
    }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# django-allauth authentication pages (`/accounts/login/`, `/accounts/signup/`, etc.)
location ^~ /accounts/ {
    if (-f /opt/wangjinghong/shared/.maintenance) {
        return 503;
    }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Custom Django Admin console path.
# MUST match `DJANGO_ADMIN_PATH` in `/etc/wangjinghong/server.env`
# (for example: `DJANGO_ADMIN_PATH=ops-console/`). Update both together if changed.
location ^~ /ops-console/ {
    if (-f /opt/wangjinghong/shared/.maintenance) {
        return 503;
    }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
