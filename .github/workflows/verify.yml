name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Type check
        working-directory: site
        run: npm run type-check
      - name: Unit tests
        working-directory: site
        run: npx vitest run
      - name: Build
        working-directory: site
        run: npm run build
      - name: Verify award image metadata
        run: node site/scripts/update-image-metadata.mjs --check
      - name: Site tooling tests
        run: node --test site/scripts/*.test.mjs

  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stats toolchain tests
        run: node --test stats/tests/*.mjs
