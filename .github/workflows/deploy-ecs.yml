name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "assets/**"
      - "deploy/**"
      - ".github/workflows/deploy-ecs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.ECS_SSH_KEY }}' > ~/.ssh/ecs-key.pem
          chmod 600 ~/.ssh/ecs-key.pem

      - name: Publish website
        env:
          DEPLOY_KEY: /home/runner/.ssh/ecs-key.pem
          SITE_ORIGIN: https://www.wangjinghong.com
        run: bash deploy/publish.sh site
