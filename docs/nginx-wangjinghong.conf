# wangjinghong.com Nginx 站点配置存档（ECS: /etc/nginx/sites-available/wangjinghong）
#
# Stage A 上线：2026-07-26（SPA 兜底 + 分层缓存头；旧站验证无恙）
# 回滚备份：/etc/nginx/sites-available/wangjinghong.bak-pre-react
# Stage B（旧 .html URL 301）：cutover 时追加，见部署计划 Task 19。
#
# CDN 行为验证结论（2026-07-26，经 CDN 双次请求 + X-Swift 头判读）：
#   - 阿里云 CDN 遵循源站 Cache-Control：no-cache → x-swift-cachetime:0、连续 MISS 每次回源；
#     max-age=604800 → HIT、TTL 照源站。控制台无需任何缓存规则改动。
#   - Stage A 前的旧 HTML 缓存副本 TTL 3600s，自然过期后即切换新策略；
#     cutover 后仍做一次全量刷新以立即生效。
server {

    server_name wangjinghong.com www.wangjinghong.com;

    root /var/www/wangjinghong;
    index index.html;

    # Vite 哈希产物：内容变则文件名变，可永久缓存
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 证书原图/缩略图：内容稳定，中缓存
    location /resume-awards/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # README stats 卡片：bot 每日更新走 scp 直达，短缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA 兜底 + HTML 不缓存（防 CDN 缓存旧 index.html 指向已删 bundle）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wangjinghong.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wangjinghong.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.wangjinghong.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = wangjinghong.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;

    server_name wangjinghong.com www.wangjinghong.com;
    return 404; # managed by Certbot




}
